# Docker Compose — production MyTDFRIK sur VPS.
#
# Cette pile NE démarre PAS Traefik : elle se greffe sur le Traefik déjà en
# place sur le VPS (réseau `traefik`, resolver ACME `letsencrypt`), aux côtés
# des autres applications hébergées. Aucun port n'est publié sur l'hôte.
#
# Différences avec docker-compose.yml (dev) :
#   - Postgres et Redis sur un réseau `internal`, sans port exposé
#   - Migrations TypeORM jouées automatiquement avant le démarrage de l'API
#   - Pas de Mailpit ni de ClamAV (courriels via SMTP/Resend réels)
#
# Usage (depuis la racine du dépôt, sur le VPS) :
#   cp docker/.env.prod.example docker/.env.prod   # puis renseigner les valeurs
#   ./scripts/deploy.sh
#
# Ou manuellement :
#   docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d --build

name: mytdfrik-prod

networks:
  # Réseau du Traefik existant, créé hors de cette pile.
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
  # Réseau privé : données. Pas de route vers l'extérieur.
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  api_storage:

x-logging: &default_logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # -------------------------- Base de données --------------------------
  # Pour une base managée externe : commenter ce service, retirer les depends_on
  # qui le référencent et renseigner DATABASE_URL dans .env.prod.
  postgres:
    image: postgres:16-alpine
    container_name: mytdfrik-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    logging: *default_logging

  # -------------------------- Cache --------------------------
  redis:
    image: redis:7-alpine
    container_name: mytdfrik-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env.prod}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    logging: *default_logging

  # -------------------------- Migrations (one-shot) --------------------------
  # Joue les migrations TypeORM puis s'arrête. L'API ne démarre qu'après sa
  # sortie en succès (service_completed_successfully).
  migrate:
    image: ${API_IMAGE:-mytdfrik/api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: mytdfrik-migrate-prod
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    # Nécessaire aux seeds lancés via ce service (ADMIN_BOOTSTRAP_*, BCRYPT_COST).
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
    command:
      - node
      - node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/database/data-source.js
    networks:
      - backend
    logging: *default_logging

  # -------------------------- Backend NestJS --------------------------
  api:
    image: ${API_IMAGE:-mytdfrik/api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: mytdfrik-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Secrets applicatifs (JWT, SMTP, Sentry, S3…).
    env_file:
      - .env.prod
    # Ces valeurs sont dérivées des domaines : elles écrasent le fichier .env.prod.
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      CORS_ORIGINS: https://${WEB_DOMAIN:?WEB_DOMAIN manquant dans .env.prod}
      API_PUBLIC_BASE_URL: https://${API_DOMAIN:?API_DOMAIN manquant dans .env.prod}
      APP_WEB_BASE_URL: https://${WEB_DOMAIN}
    volumes:
      # Pièces jointes quand STORAGE_DRIVER=local. Inutile avec STORAGE_DRIVER=s3.
      - api_storage:/app/.storage
    # Tous les noms de routeurs, services et middlewares Traefik sont globaux au
    # VPS : le préfixe `mytdfrik-` évite toute collision avec les autres piles
    # (et avec `api@internal`, le dashboard de Traefik).
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      # HTTP : redirection permanente vers HTTPS (le Traefik du VPS n'a pas de
      # redirection globale, chaque pile déclare la sienne).
      - traefik.http.routers.mytdfrik-api-http.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.mytdfrik-api-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}
      - traefik.http.routers.mytdfrik-api-http.middlewares=mytdfrik-api-redirect
      - traefik.http.middlewares.mytdfrik-api-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.mytdfrik-api-redirect.redirectscheme.permanent=true
      # HTTPS
      - traefik.http.routers.mytdfrik-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.mytdfrik-api.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.mytdfrik-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mytdfrik-api.middlewares=mytdfrik-api-secure,mytdfrik-api-compress
      - traefik.http.services.mytdfrik-api.loadbalancer.server.port=3000
      # Middlewares propres à l'API (en complément de Helmet côté applicatif).
      - traefik.http.middlewares.mytdfrik-api-compress.compress=true
      - traefik.http.middlewares.mytdfrik-api-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.mytdfrik-api-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.mytdfrik-api-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.mytdfrik-api-secure.headers.frameDeny=true
      - traefik.http.middlewares.mytdfrik-api-secure.headers.referrerPolicy=strict-origin-when-cross-origin
    networks:
      - proxy
      - backend
    logging: *default_logging

  # -------------------------- Frontend Next.js --------------------------
  web:
    image: ${WEB_IMAGE:-mytdfrik/web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # ATTENTION : une variable NEXT_PUBLIC_* est figée dans le bundle au build.
        # Changer de domaine d'API impose de reconstruire l'image web.
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
    container_name: mytdfrik-web-prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      # Utilisée par le rendu serveur (middleware, server components).
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
    # Le rendu serveur appelle l'API par son URL publique, donc par l'IP publique
    # du VPS. Si cette boucle ne passe pas (NAT sans hairpin), décommenter :
    # extra_hosts:
    #   - '${API_DOMAIN}:host-gateway'
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      # HTTP : redirection permanente vers HTTPS
      - traefik.http.routers.mytdfrik-web-http.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.mytdfrik-web-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}
      - traefik.http.routers.mytdfrik-web-http.middlewares=mytdfrik-web-redirect
      - traefik.http.middlewares.mytdfrik-web-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.mytdfrik-web-redirect.redirectscheme.permanent=true
      # HTTPS
      - traefik.http.routers.mytdfrik-web.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.mytdfrik-web.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.mytdfrik-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mytdfrik-web.middlewares=mytdfrik-web-secure,mytdfrik-web-compress
      - traefik.http.services.mytdfrik-web.loadbalancer.server.port=3001
      # Middlewares propres au front (Next.js ne pose pas ces en-têtes).
      - traefik.http.middlewares.mytdfrik-web-compress.compress=true
      - traefik.http.middlewares.mytdfrik-web-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.mytdfrik-web-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.mytdfrik-web-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.mytdfrik-web-secure.headers.frameDeny=true
      - traefik.http.middlewares.mytdfrik-web-secure.headers.referrerPolicy=strict-origin-when-cross-origin
    networks:
      - proxy
    logging: *default_logging
